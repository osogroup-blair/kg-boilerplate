# Phase 2 additions (2026-10-11). P2 added NO third-party Python or JavaScript packages: kg-ontology uses pydantic and pyyaml (already pinned above) and
# kg-knowledge uses the existing database, graph and router packages. hypothesis was considered for the evaluator purity property tests and not used:
# purity is asserted by a source scan plus determinism and no-mutation tests.
p2_additions:
  workspace_packages:
    kg-ontology: "0.1.0"    # pure: spec, validator, diff, rule catalog; import-linter keeps it free of db/graph/http imports
    kg-knowledge: "0.1.0"   # ontology service, command pipeline, reads, projector
  python_packages: {}
  admin_packages: {}
  postgres_extensions:
    pg_trgm: "1.6"          # an extension of the pinned pgvector/pg17 image, not a package: trigram index behind the entity directory search
  migrations:
    head: "0002_ontology_and_commands"
  model_purposes:
    graph_projection: "oso/embedding (embedding-only)"

# Phase 3 additions (2026-10-11). P3 added NO third-party packages: kg-jobs uses sqlalchemy/structlog/prometheus (already pinned), and kg-ingestion's
# encryption uses `cryptography` (pinned above at 50.0.2 since P1, now also a direct dependency of kg-ingestion). The admin console gained pages only.
p3_additions:
  workspace_packages:
    kg-jobs: "0.1.0"        # the generic transactional outbox: enqueue, ops.* client, retry policy, dispatcher, test-only fault injection; import-linter keeps it free of domain, graph and model imports
    kg-ingestion: "0.1.0"   # event envelope, AES-256-GCM payload cipher, idempotent acceptance, pipeline + orchestrator, normalize, replay/reconcile, key re-encryption
  python_packages: {}       # cryptography==50.0.2 is already pinned (P1)
  admin_packages: {}
  migrations:
    head: "0003_interactions_and_outbox"
  postgres_functions:
    ops: "claim_jobs, heartbeat_jobs, complete_job, release_jobs, cancel_job, backlog_stats, workspaces_with_pending_projection (P2)"
  pipeline:
    version: "p3.v1"        # pinned on every interaction and job (ONT-03); stages: normalize (enabled), graph_ingest (P4, disabled), memory_propose (P5, disabled)
  encryption:
    algorithm: "AES-256-GCM"
    associated_data: "workspace_id|interaction_id|form"
    keyring: "PAYLOAD_KEYS / PAYLOAD_ACTIVE_KID (production refuses the development key)"
