# ADR-011: pinned stack. Verified together by the Phase 0 offline checks (see docs/compatibility-report.md).
# Python packages are locked exactly in spikes/uv.lock; production code (P1+) copies these pins into its own lock file.
version: 1
verified_on: "2026-10-11"
host: "macOS (Apple silicon), Docker Desktop 28.4.0"
runtime:
  python: "3.12.15"          # uv-managed CPython; spikes/pyproject.toml requires ==3.12.*
  uv: "0.13.0"
services:
  neo4j:
    image: "neo4j:5.26-community"
    digest: "neo4j@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069"
    server: "5.26.31"
    edition: community       # no CREATE DATABASE (GR-04): tenancy is group_id on one database
    plugins: {apoc: "5.26.31"}
  postgres:
    image: "pgvector/pgvector:pg17"
    digest: "pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d"
    server: "17.11"
    pgvector: "0.8.7"        # needed for hnsw.iterative_scan (>=0.8.0); MVP does not use HNSW (ADR-019)
  mock_router_base_image:
    image: "python:3.12-slim"
    digest: "python@sha256:a6e34c598f2467ed0e9a8d349809fcd8b5c603269512df273a0bb1784edc11b1"
python_packages:
  graphiti-core: "0.30.2"    # exact pin. Adapter boundary packages/graph from P1 because minors change APIs (see ADR-011)
  neo4j: "6.4.0"             # Python driver
  pydantic: "2.14.0"
  pydantic-core: "2.50.0"
  openai: "3.29.0"           # client only, pointed at the router; Graphiti uses OpenAIGenericClient (chat completions)
  tiktoken: "0.14.0"
  psycopg: "3.3.6"
  pgvector: "0.5.1"          # python adapter
  sqlalchemy: "2.1.4"
  alembic: "1.20.0"
  fastapi: "0.143.0"
  starlette: "1.7.0"
  uvicorn: "0.54.0"
  httpx: "0.28.1"
  pyjwt: "2.15.1"
  cryptography: "50.0.2"
  numpy: "2.5.4"
  pyyaml: "6.0.3"
  pytest: "9.1.1"
  pytest-asyncio: "1.4.0"
router:
  name: "Oso Model Router"
  api: "v1 (OpenAI-compatible chat completions + embeddings)"
  seed_reference: "scripts/seed-logical-router.ts prices dated 2026-09-29"
  embedding_model: {alias: "oso/embedding", model: "intfloat/multilingual-e5-small", dim: 384, max_input_tokens: 512}
  status: "contract derived from source; live verification pending (make verify-router)"

# Phase 1 additions (pinned at install time, 2026-10-11). Python versions are the exact ones in uv.lock; JS versions are the exact ones in apps/admin/package.json.
# P1 database driver decision: psycopg async (the driver verified in Phase 0) rather than asyncpg.
p1_additions:
  python_packages:
    pydantic-settings: "2.15.0"
    structlog: "26.1.0"
    prometheus-client: "0.26.0"
    typer: "0.27.3"
    opentelemetry-api: "1.45.1"
    opentelemetry-sdk: "1.45.1"
    opentelemetry-exporter-otlp-proto-http: "1.45.1"
    pytest-cov: "7.1.0"
    ruff: "0.17.0"
    mypy: "2.4.0"
    import-linter: "2.15"
    types-pyyaml: "6.0.12.20260906"
    asgi-lifespan: "2.1.0"
    # hatchling: not in uv.lock
  node:
    runtime: "v20.19.5"
    note: "React 18 / Vite 6 / Tailwind 3 / Vitest 3 / ESLint 9 / TypeScript 5.9 are deliberate: newer majors exist (React 19, Vite 8, Vitest 5, ESLint 10, TypeScript 7) but were not used for the first admin shell; revisit at P9."
  admin_packages:
    "@radix-ui/react-dialog": "1.2.0"
    "@tanstack/react-query": "5.104.2"
    "clsx": "2.1.1"
    "lucide-react": "1.55.0"
    "openapi-fetch": "0.13.8"
    "react": "18.3.1"
    "react-dom": "18.3.1"
    "react-router-dom": "6.30.6"
    "@eslint/js": "9.39.5"
    "@playwright/test": "1.64.0"
    "@testing-library/jest-dom": "6.9.1"
    "@testing-library/react": "16.3.3"
    "@testing-library/user-event": "14.6.7"
    "@types/node": "20.19.43"
    "@types/react": "18.3.31"
    "@types/react-dom": "18.3.7"
    "@vitejs/plugin-react": "4.7.0"
    "autoprefixer": "10.6.1"
    "eslint": "9.39.5"
    "eslint-plugin-react-hooks": "5.2.0"
    "globals": "17.13.0"
    "jsdom": "26.1.0"
    "openapi-typescript": "7.13.0"
    "postcss": "8.5.29"
    "tailwindcss": "3.4.19"
    "typescript": "5.9.3"
    "typescript-eslint": "8.71.1"
    "vite": "6.4.4"
    "vitest": "3.2.7"
  services:
    admin_dev_port: 5273   # 5173/5174 are taken by other projects on this machine

# Phase 2 additions (2026-10-11). P2 added NO third-party Python or JavaScript packages: kg-ontology uses pydantic and pyyaml (already pinned above) and
# kg-knowledge uses the existing database, graph and router packages. hypothesis was considered for the evaluator purity property tests and not used:
# purity is asserted by a source scan plus determinism and no-mutation tests.
p2_additions:
  workspace_packages:
    kg-ontology: "0.1.0"    # pure: spec, validator, diff, rule catalog; import-linter keeps it free of db/graph/http imports
    kg-knowledge: "0.1.0"   # ontology service, command pipeline, reads, projector
  python_packages: {}
  admin_packages: {}
  postgres_extensions:
    pg_trgm: "1.6"          # an extension of the pinned pgvector/pg17 image, not a package: trigram index behind the entity directory search
  migrations:
    head: "0002_ontology_and_commands"
  model_purposes:
    graph_projection: "oso/embedding (embedding-only)"

# Phase 3 additions (2026-10-11). P3 added NO third-party packages: kg-jobs uses sqlalchemy/structlog/prometheus (already pinned), and kg-ingestion's
# encryption uses `cryptography` (pinned above at 50.0.2 since P1, now also a direct dependency of kg-ingestion). The admin console gained pages only.
p3_additions:
  workspace_packages:
    kg-jobs: "0.1.0"        # the generic transactional outbox: enqueue, ops.* client, retry policy, dispatcher, test-only fault injection; import-linter keeps it free of domain, graph and model imports
    kg-ingestion: "0.1.0"   # event envelope, AES-256-GCM payload cipher, idempotent acceptance, pipeline + orchestrator, normalize, replay/reconcile, key re-encryption
  python_packages: {}       # cryptography==50.0.2 is already pinned (P1)
  admin_packages: {}
  migrations:
    head: "0003_interactions_and_outbox"
  postgres_functions:
    ops: "claim_jobs, heartbeat_jobs, complete_job, release_jobs, cancel_job, backlog_stats, workspaces_with_pending_projection (P2)"
  pipeline:
    version: "p3.v1"        # pinned on every interaction and job (ONT-03); stages: normalize (enabled), graph_ingest (P4, disabled), memory_propose (P5, disabled)
  encryption:
    algorithm: "AES-256-GCM"
    associated_data: "workspace_id|interaction_id|form"
    keyring: "PAYLOAD_KEYS / PAYLOAD_ACTIVE_KID (production refuses the development key)"

# Phase 4 additions (2026-10-11). The only new third-party package is the admin console's graph renderer (exact, no range); Python gained one workspace
# package and no new dependency (Graphiti, neo4j and the OpenAI SDK are pinned above and stay behind kg_graph).
p4_additions:
  workspace_packages:
    kg-extraction: "0.1.0"  # the graph_ingest stage, the reconciler and identity helpers; import-linter keeps it from importing apps and keeps graphiti/openai behind kg_graph
  python_packages: {}
  admin_packages:
    cytoscape: "3.33.1"     # Graph Explorer canvas (MIT); exact version, with an accessible table view of the same neighbourhood
  migrations:
    head: "0004_extraction_identity_review"
  postgres_functions:
    ops: "claim_jobs, heartbeat_jobs, complete_job, release_jobs, cancel_job, backlog_stats, review_stats (P4); workspaces_with_pending_projection DROPPED (the P2 sweeper is deleted)"
  pipeline:
    version: "p4.v1"        # stages: normalize, graph_ingest (enabled), memory_propose (P5, disabled)
  extraction:
    graphiti: "0.30.2 (add_episode with a pre-created episode uuid; communities off); see docs/adr/ADR-026-graphiti-extraction-behaviour.md"
    thresholds: "IDENTITY_TRGM_MIN 0.45, IDENTITY_COS_MIN 0.92 (to be finalised by make eval-extraction-live)"

# Phase 5 additions (2026-10-12). No new third-party package (pgvector and pg_trgm are already installed; `unaccent` was considered for the lexical half and NOT adopted:
# the `simple` configuration plus a function-word list is enough, and the lexical half is a recall aid for the vector half). Python gained one workspace package.
p5_additions:
  workspace_packages:
    kg-memory: "0.1.0"      # curated memory: scopes, writers, scoped search, memory_propose / embed / expire, review decisions; import-linter keeps it from the graph, Graphiti, apps and the OpenAI SDK
  python_packages: {}
  admin_packages: {}
  migrations:
    head: "0005_curated_memory"
  postgres_functions:
    ops: "claim_jobs, heartbeat_jobs, complete_job, release_jobs, cancel_job, backlog_stats, review_stats, memory_stats (P5: aggregates only)"
  pipeline:
    version: "p5.v1"        # stages: normalize, graph_ingest, memory_propose (enabled, after graph_ingest)
  memory:
    prompt: "mem.v1 (kg_memory/prompts/mem_v1.py); purpose memory_extraction -> oso/general (PROVISIONAL until make verify-router confirms GR-12)"
    embeddings: "E5 passage:/query: through ModelGateway.embed, vector(384), embedding_version 1 (MEMORY_EMBEDDING_VERSION), exact cosine, no ANN index (ADR-019)"
    ranker: "mem-rrf.v1 (ADR-031)"
    thresholds: "MEMORY_VEC_MIN_COSINE 0.2 (mock placeholder; set from make eval-memory-live), extraction_min_importance 0.5, max_memories_per_interaction 3"

# Phase 6 additions (2026-10-12). One new third-party DEV package: Hypothesis, pinned exactly, for the property tests of the context invariants (CTX-01 budget ceiling, CTX-02 every item
# cited, CTX-05 required items kept, CTX-06 byte-stable output, CTX-08 inert content). The P2 ADR deferred it until a property needed it; the hard token ceiling is that property.
# No runtime package was added. Python gained one workspace package and the CLI gained httpx (already a workspace dependency of the API) to call the API.
p6_additions:
  workspace_packages:
    kg-context: "0.1.0"     # the task-aware context engine; import-linter keeps it off the graph, graphiti_core and kg_memory.store, and lets only the API and worker import it
  python_packages: {}
  python_dev_packages:
    hypothesis: "6.169.0"   # property tests (packages/context/tests/test_properties.py)
  admin_packages: {}
  migrations:
    head: "0006_context_traces"
  postgres_functions:
    ops: "claim_jobs, heartbeat_jobs, complete_job, release_jobs, cancel_job, backlog_stats, review_stats, memory_stats, purge_expired_context_traces, purge_expired_context_debug (P6: counts only)"
  pipeline:
    version: "p5.v1"        # unchanged: a context build is a read, not a pipeline stage
  context:
    ranker: "ctx-rank.v1 (ADR-033)"
    tokenizer: "tiktoken max(o200k_base, cl100k_base) x (1 + CONTEXT_TOKEN_MARGIN 0.10): PROVISIONAL until TK-02 measures the router's prompt_tokens (ADR-020)"
    compression: "structured (default) | extractive | summarized (opt-in per profile, validated, falls back); purpose context_compression -> oso/fast (PROVISIONAL until make verify-router)"
    query_embedding: "ONCE per build: ModelGateway.embed(kind=query) shared by the graph (graphiti search with query_vector) and the memory search (CX-01, ADR-032 §6)"
    thresholds: "evidence recall >= 0.9 (cases 1-8), irrelevant inclusion <= 10%, temporal correctness 100% (PROPOSED; strict: leakage 0, budget adherence 100%, attribution 100%)"

# Phase 7 additions (2026-10-12). Two new workspace members that are CLIENTS of the platform, not parts of it (import-linter forbids them from importing any kg_* package but the SDK),
# one new runtime package (the MCP SDK, for apps/mcp only) and one new DEV package (the SDK model generator). No server-side dependency was added.
p7_additions:
  workspace_packages:
    kg-platform-sdk: "0.1.0"   # sdk/python: a thin typed client (httpx + pydantic); models generated from contracts/openapi.json (scripts/gen_sdk_models.py, drift-tested)
    kg-mcp: "0.1.0"            # apps/mcp: stateless Streamable HTTP MCP server over the SDK; forwards the caller's own key; no database, router or service credential
  python_packages:
    mcp: "1.30.0"              # the official Python MCP SDK (low-level Server + StreamableHTTPSessionManager, stateless, JSON responses); apps/mcp only. 2.x exists (2.3.0) and is a different API: not adopted
  python_dev_packages:
    datamodel-code-generator: "0.83.0"   # generates the SDK's pydantic models from the OpenAPI contract; run by `make sdk-models` and by the drift test
  admin_packages: {}
  migrations:
    head: "0007_agents_and_acls"
  postgres_functions:
    ops: "claim_jobs, heartbeat_jobs, complete_job, release_jobs, cancel_job, backlog_stats, review_stats, memory_stats, purge_expired_context_traces, purge_expired_context_debug (P7: none added)"
    public: "curated_memories_evidence_guard, memory_scope_repoint_guard, memory_subject_repoint_guard (triggers: the only legal moves of evidence_status and of a merged subject's references)"
  pipeline:
    version: "p5.v1"        # unchanged: registration, grants and revocation are not pipeline stages. A compromised submitter's pending stages are skipped_by_policy (submitter_compromised)
  agents:
    grants: "principal_scopes.privileges subset of {read, propose, publish}; backfill {read, propose}; publish is never implicit (ADR-036, ADR-038)"
    subject_acl: "entity_types.<T>.access: workspace | subject_scoped (ontology v1.4.0 example); SubjectFilter is a REQUIRED argument of every kg_knowledge read (ADR-037)"
    quotas: "requests per minute (in-process bucket, PRINCIPAL_REQUESTS_PER_MINUTE default 1200), context tokens and interactions per UTC day (durable tables, DB clock); shared limiter is P9"
    revocation: "retired | compromised (final); compromised quarantines derivatives as disputed + a source_compromised review item (ADR-039)"
    sdk_mcp: "SDK retries only 429/502/503/504, one Idempotency-Key per logical call; MCP tools are the SDK's request models with additionalProperties:false (ADR-040)"

# Phase 8 additions (2026-10-15). NO new third-party package (Python, dev or admin): the purge gate, the journal, the simulation and the consolidation validator are plain
# Postgres, the standard library and the Neo4j driver already pinned for Graphiti. No new workspace package either: the code lives in kg-governance, kg-knowledge, kg-memory,
# kg-extraction, kg-graph and the apps.
p8_additions:
  workspace_packages: {}
  python_packages: {}
  python_dev_packages: {}
  admin_packages: {}
  migrations:
    head: "0008_governance"
  postgres_functions:
    ops: "write_platform_receipt, read_platform_receipt, purge_workspace_rows, retention_candidates, retention_purge_model_calls, workspace_egress_denials, deletion_stats, workspaces_with_deletion_work (ids, counts and codes only)"
    public: "purge_gate, purge_guard (generic row trigger on every gated table), commands_payload_guard, review_text_guard, context_trace_redact_guard, outbox_payload_guard, deletion_requests_guard, deletion_items_guard, deletion_records_guard (tombstones and suppressions are append-only)"
  pipeline:
    version: "p5.v1"        # unchanged: deletion, consolidation and simulation are separate job stages (deletion_plan, deletion_purge, deletion_verify, memory_consolidate, ontology_simulation, simulation_cleanup)
  models:
    purposes: "memory_consolidation and ontology_simulation, both oso/general (PROVISIONAL until make eval-consolidation-live / eval-simulation-live)"
    prompt: "cons.v1 (kg_memory/prompts/cons_v1.py)"
  governance:
    purge_gate: "a DELETE or redaction is allowed only for a row listed in a purging request of the same workspace (or kind = workspace); audit_log is never alterable (ADR-044)"
    journal: "DELETION_JOURNAL_DIR/deletions.jsonl, HMAC-chained, ids and suppression HMACs only (ADR-045); required in production"
    egress: "workspace setting = deny list unioned with the platform's; cache WORKSPACE_EGRESS_TTL_SECONDS (30 s default) (ADR-047)"
    simulation: "staging group ws-<uuid>-sim-<run12> on the same Neo4j database, removed by the run and by a delayed job (ADR-046)"

# Phase 9 additions (2026-10-17). Release-hardening tooling. The scanners and the backup tool are NOT runtime dependencies: they run from pinned images / `uv tool run` and are recorded here so
# a scan result can be reproduced. New workspace package: kg-reconcile (drift detection, repair, Flow F reindex).
p9_additions:
  workspace_packages: {kg-reconcile: "packages/reconcile"}
  migrations:
    head: "0009_release"
  scanners:
    pip_audit: "2.10.1"            # uv tool run --from pip-audit==2.10.1 (locked set exported with `uv export --frozen --no-dev`)
    cyclonedx_bom: "7.5.0"         # SBOMs for the Python environment (cyclonedx-py); `npm sbom` for the admin dependencies; trivy for images
    npm_audit: "npm audit --omit=dev (apps/admin)"
    trivy:
      image: "aquasec/trivy:latest"
      digest: "aquasec/trivy@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222"
      version: "0.76.0"
    gitleaks:
      image: "zricethezav/gitleaks:latest"
      digest: "zricethezav/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"
      version: "v8.30.1"
      config: ".gitleaks.toml (documented development placeholders only)"
    ruff: "S rules (bandit) via the project's lint config"
  scan_policy: "HIGH/CRITICAL blocks unless docs/security/scan-exceptions.yaml holds an owned, unexpired exception; report eval/reports/<date>/scan.json; SBOMs in eval/reports/sbom/"
  backup_tools_image:
    tag: "kg-backup-tools:p9"
    base: "pgvector/pgvector:pg17 (same digest as services.postgres) + age; apt upgrade applied, gosu removed so the image scans clean"
    age: "1.1.1"
  limiter:
    backend: "postgres (ops.rate_hit / ops.slot_acquire, UNLOGGED counters) or memory; fail-closed for context builds"
  rotation:
    secrets: "SecretRing (version:secret) for JWT (kid), content HMAC and the key pepper; pepper dual-verify via api_keys.pepper_id"
