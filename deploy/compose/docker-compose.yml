# Phase 1 stack. Host ports avoid the other Postgres containers on this machine (5432-5437, 5543 is the spike stack).
# postgres 5544 · neo4j 7475/7688 · mock-router 8782 · api 8000 (+9100 metrics) · worker metrics 9101 · admin 5273
name: kg

x-python-env: &python-env
  ENV: ${ENV:-dev}
  DATABASE_URL_APP: postgresql+psycopg://kg_app:${KG_APP_PASSWORD:-kg_app_dev}@postgres:5432/kg
  DATABASE_URL_OWNER: postgresql+psycopg://kg_owner:${KG_OWNER_PASSWORD:-kg_owner_dev}@postgres:5432/kg
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: ${NEO4J_USER:-neo4j}
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:-kg-neo4j-dev}
  OSO_ROUTER_MODE: ${OSO_ROUTER_MODE:-mock}
  OSO_ROUTER_MOCK_URL: http://mock-router:8781/v1
  OSO_ROUTER_LIVE_URL: http://host.docker.internal:8780/v1
  OSO_ROUTER_API_KEY_API: ${OSO_ROUTER_API_KEY_API:-mock-key}
  OSO_ROUTER_API_KEY_WORKER: ${OSO_ROUTER_API_KEY_WORKER:-mock-key}
  AUTH_KEY_PEPPER: ${AUTH_KEY_PEPPER:-dev-only-pepper-change-me-32-bytes-min}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-dev-only-jwt-secret-change-me-32-bytes}
  AUTH_JWT_TTL_SECONDS: ${AUTH_JWT_TTL_SECONDS:-900}
  TELEMETRY_HMAC_SECRET: ${TELEMETRY_HMAC_SECRET:-dev-only-telemetry-secret}
  # P3: payload encryption at rest (keyring "kid:base64(32 bytes),...") and the keyed content hash. The defaults are development values; ENV=production refuses them.
  PAYLOAD_KEYS: ${PAYLOAD_KEYS:-dev1:ZGV2LW9ubHktcGF5bG9hZC1rZXktMzItYnl0ZXMtISE=}
  PAYLOAD_ACTIVE_KID: ${PAYLOAD_ACTIVE_KID:-dev1}
  CONTENT_HMAC_SECRET: ${CONTENT_HMAC_SECRET:-dev-only-content-hmac-secret-32-bytes}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
  GRAPHITI_TELEMETRY_ENABLED: "false"

x-python-build: &python-build
  context: ../..
  dockerfile: deploy/docker/python.Dockerfile

services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-kg_admin_dev}
      KG_OWNER_PASSWORD: ${KG_OWNER_PASSWORD:-kg_owner_dev}
      KG_APP_PASSWORD: ${KG_APP_PASSWORD:-kg_app_dev}
    ports: ["127.0.0.1:5544:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kg_test && pg_isready -U postgres -d kg"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  neo4j:
    image: neo4j:5.26-community@sha256:c7d25c0eeebfe125718d58b72ed5d663c85d0479047733845eb2237c67ce8069
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-kg-neo4j-dev}
      NEO4J_PLUGINS: '["apoc"]'
      # Docker Desktop here has ~3.8 GiB shared with other projects; P4's extraction runs made the 768m heap get OOM-killed once, so the budget is tighter and bounded
      NEO4J_server_memory_heap_initial__size: 384m
      NEO4J_server_memory_heap_max__size: 640m
      NEO4J_server_memory_pagecache_size: 192m
      NEO4J_server_jvm_additional: "-XX:MaxDirectMemorySize=192m"
    ports: ["127.0.0.1:7475:7474", "127.0.0.1:7688:7687"]
    volumes: ["neo4jdata:/data"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u $${NEO4J_AUTH%%/*} -p $${NEO4J_AUTH#*/} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  mock-router:
    build:
      context: ../..
      dockerfile: tools/mock_router/Dockerfile
    environment:
      MOCK_ROUTER_API_KEY: ${MOCK_ROUTER_API_KEY:-mock-key}
      MOCK_ROUTER_MAX_CLASSIFICATION: restricted
    ports: ["127.0.0.1:8782:8781"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8781/health').status==200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 20

  migrate:
    build: *python-build
    image: kg-python:dev
    command: ["kg", "db", "upgrade"]
    environment: *python-env
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    image: kg-python:dev
    command: ["uvicorn", "kg_api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *python-env
      SERVICE_NAME: kg-api
    ports: ["127.0.0.1:8000:8000", "127.0.0.1:9100:9100"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      mock-router: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health').status==200 else 1)"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 5s

  worker:
    image: kg-python:dev
    command: ["python", "-m", "kg_worker"]
    environment:
      <<: *python-env
      SERVICE_NAME: kg-worker
      # Outbox dispatcher (P3). A short lease so a killed worker's jobs are picked up quickly in development; production keeps the 30 s default.
      WORKER_LEASE_SECONDS: ${WORKER_LEASE_SECONDS:-10}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      WORKER_SHUTDOWN_GRACE_SECONDS: ${WORKER_SHUTDOWN_GRACE_SECONDS:-20}
      # Development-only failure injection: `make demo-p3` arms it by writing .local/faults/spec. ENV=production refuses KG_FAULTS_DIR.
      KG_FAULTS_DIR: ${KG_FAULTS_DIR:-/faults}
    volumes: ["../../.local/faults:/faults"]
    stop_grace_period: 30s
    ports: ["127.0.0.1:9101:9101"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      postgres: {condition: service_healthy}
      neo4j: {condition: service_healthy}
      mock-router: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9101/metrics').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  admin:
    profiles: ["dev"]
    image: node:20-slim
    working_dir: /work/apps/admin
    command: ["sh", "-c", "npm ci && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    volumes: ["../..:/work"]
    ports: ["127.0.0.1:5273:5273"]
    depends_on:
      api: {condition: service_healthy}

volumes:
  pgdata:
  neo4jdata:
