# Optional override: reach a router that runs in ANOTHER Docker network on this host.
#
# A router that publishes its port on the host's loopback only (127.0.0.1:8780) cannot be reached from a container on Linux: `host.docker.internal` resolves to the
# bridge gateway, where nothing listens ("connection refused").
#
#   make up OSO_ROUTER_NETWORK=decision-model-service_default OSO_ROUTER_CONTAINER=model-gateway
#
# A small forwarder (`router-proxy`) joins BOTH networks and relays TCP to the router; the api and worker stay on this stack's network only and call
# http://router-proxy:8780/v1. Do not attach the api or worker to the router's network instead: both networks would then answer to `postgres` and `neo4j`
# (the router stack has services of those names) and DNS can hand a container the wrong database (a worker did fail with "password authentication failed").
#
# The Makefile adds this file only when OSO_ROUTER_NETWORK is set, so CI and machines without such a router are unaffected. Host-run tools (verify-router,
# live-session, the examples) keep using OSO_ROUTER_LIVE_URL=http://127.0.0.1:8780/v1.
services:
  router-proxy:
    image: alpine/socat:1.8.0.1
    command: ["-d", "TCP-LISTEN:8780,fork,reuseaddr", "TCP:${OSO_ROUTER_CONTAINER:-model-gateway}:${OSO_ROUTER_PORT:-8780}"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [default, router]
  api:
    environment:
      OSO_ROUTER_LIVE_URL: http://router-proxy:8780/v1
  worker:
    environment:
      OSO_ROUTER_LIVE_URL: http://router-proxy:8780/v1
networks:
  router:
    external: true
    name: ${OSO_ROUTER_NETWORK:?set OSO_ROUTER_NETWORK to the router's Docker network}
