# Mirrors `make check`, plus the examples on a fresh clone (the `examples` job).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"        # nightly: the release sweep against two API replicas
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      KG_REQUIRE_STACK: "1"
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: kg_admin_dev
          KG_OWNER_PASSWORD: kg_owner_dev
          KG_APP_PASSWORD: kg_app_dev
        ports: ["5544:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 3s --health-retries 30
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/kg-neo4j-dev
          NEO4J_PLUGINS: '["apoc"]'
        ports: ["7688:7687"]
        options: >-
          --health-cmd "cypher-shell -u neo4j -p kg-neo4j-dev 'RETURN 1'" --health-interval 5s --health-retries 30 --health-start-period 20s
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the gate-record check compares against the base branch
      - name: Create roles and databases (service containers cannot mount the init script)
        run: |
          export PGPASSWORD=kg_admin_dev
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 5544 -U postgres && break; sleep 2; done
          KG_OWNER_PASSWORD=kg_owner_dev KG_APP_PASSWORD=kg_app_dev POSTGRES_USER=postgres \
            bash -c 'sed "s#psql -v ON_ERROR_STOP=1#psql -h 127.0.0.1 -p 5544 -v ON_ERROR_STOP=1#" deploy/compose/postgres-init/01-roles.sh | bash'
      - name: Mock router
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait mock-router
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json
      - run: make sync admin-install
      - run: make check
      - name: Evaluation gate (mock router; strict metrics exact, proposed metrics inside tolerance)
        run: make eval-all eval-gate
      - name: Live-gate record for model-affecting changes
        if: github.event_name == 'pull_request'
        run: uv run python scripts/check_gate_record.py --base origin/${{ github.base_ref }}
      - name: Release sweep against two API replicas (nightly and on demand)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: make test-release

  examples:
    # A runner is a fresh clone: this job is the "fresh clone, make up seed examples test-examples" gate of phase 10. It does not depend on `check` so a red
    # integration run elsewhere cannot hide an examples regression (or the reverse).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
      - run: make sync examples-install
      - name: Stack (postgres, neo4j, mock router, migrations, api, worker) and the MCP server
        run: |
          make up seed
          make mcp-up
      - name: Clean-start demos (demo-p1 and demo-p2 against the compose stack)
        # They live here, not in `check`: the compose stack and the service containers of `check` both want host ports 5544 and 7688.
        run: |
          make demo-p1
          make demo-p2
      - name: The examples (Sarah, the CRM and support-desk domains, agents through the SDK and MCP)
        run: make examples
      - name: The tutorial agent (reads the keys the Sarah example left behind)
        run: make demo-agent
      - name: The examples and the seven notebooks as tests
        run: make test-examples
      - name: The public sandbox broker against the real stack (seeds a workspace, uses its keys, ends it)
        run: make sandbox-test
      - name: The site's recorded tapes still match what the platform does (shape, not bytes)
        run: make tapes-check ARGS="--rerecord"
      - name: Example reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-reports
          path: |
            examples/sarah/reports
            examples/domains/crm/reports
            examples/agents/reports
            examples/domains/support/reports
          if-no-files-found: ignore

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks scans the history
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.4"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: make sync
      - run: docker build -f deploy/docker/python.Dockerfile -t kg-python:dev . && uv run python -m tools.backup build-image
      - name: Dependencies, images, filesystem, secrets, SBOM (HIGH/CRITICAL blocks unless docs/security/scan-exceptions.yaml says otherwise)
        run: make scan

  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alert rules (promtool check + unit tests)
        run: make obs-test
