name: Feature request
description: Propose something new
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: The problem you are trying to solve}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: What you would like to see, description: "Is it configuration (an ontology, a profile) or a platform change?"}
