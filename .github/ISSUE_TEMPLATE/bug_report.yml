name: Bug report
description: Something does not work as the documentation says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "For a security problem, do not open an issue: see SECURITY.md."
  - type: textarea
    id: what
    attributes: {label: What happened, description: "And what you expected"}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Steps to reproduce, description: "Commands, a request, or an example that fails", render: shell}
    validations: {required: true}
  - type: input
    id: commit
    attributes: {label: Commit or version, placeholder: "git rev-parse --short HEAD"}
  - type: dropdown
    id: router
    attributes: {label: Model router, options: [mock router, live router, not sure]}
  - type: textarea
    id: logs
    attributes: {label: Logs or the error envelope, description: "Include the request_id; do not paste keys or content you cannot share", render: text}
