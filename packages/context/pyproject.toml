[project]
name = "kg-context"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "kg-common",
  "kg-domain",
  "kg-obs",
  "kg-db",
  "kg-governance",
  "kg-modelgw",
  "kg-ontology",
  "kg-jobs",
  "kg-knowledge",
  "kg-ingestion",
  "kg-memory",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_context"]

[tool.uv.sources]
kg-common = { workspace = true }
kg-domain = { workspace = true }
kg-obs = { workspace = true }
kg-db = { workspace = true }
kg-governance = { workspace = true }
kg-modelgw = { workspace = true }
kg-ontology = { workspace = true }
kg-jobs = { workspace = true }
kg-knowledge = { workspace = true }
kg-ingestion = { workspace = true }
kg-memory = { workspace = true }
