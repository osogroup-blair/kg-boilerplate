[project]
name = "kg-jobs"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "kg-common",
  "kg-obs",
  "kg-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_jobs"]

[tool.uv.sources]
kg-common = { workspace = true }
kg-obs = { workspace = true }
kg-db = { workspace = true }
