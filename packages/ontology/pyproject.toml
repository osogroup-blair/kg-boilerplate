[project]
name = "kg-ontology"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "pydantic==2.14.0",
  "pyyaml==6.0.3",
  "kg-common",
  "kg-domain",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_ontology"]

[tool.uv.sources]
kg-common = { workspace = true }
kg-domain = { workspace = true }
