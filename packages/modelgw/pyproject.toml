[project]
name = "kg-modelgw"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "httpx==0.28.1",
  "pyyaml==6.0.3",
  "kg-domain",
  "kg-common",
  "kg-obs",
  "kg-db",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_modelgw"]

[tool.uv.sources]
kg-domain = { workspace = true }
kg-common = { workspace = true }
kg-obs = { workspace = true }
kg-db = { workspace = true }
