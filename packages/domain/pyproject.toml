[project]
name = "kg-domain"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "pydantic==2.14.0",
  "kg-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_domain"]

[tool.uv.sources]
kg-common = { workspace = true }
