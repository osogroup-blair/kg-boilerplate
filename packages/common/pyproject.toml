[project]
name = "kg-common"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "pydantic==2.14.0",
  "pydantic-settings",
  "pyyaml==6.0.3",
  "tiktoken==0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_common"]
