[project]
name = "kg-db"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "sqlalchemy[asyncio]==2.1.4",
  "alembic==1.20.0",
  "psycopg[binary]==3.3.6",
  "kg-common",
  "kg-obs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_db"]

[tool.uv.sources]
kg-common = { workspace = true }
kg-obs = { workspace = true }
