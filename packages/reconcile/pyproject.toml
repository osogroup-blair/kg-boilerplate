[project]
name = "kg-reconcile"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "kg-common",
  "kg-domain",
  "kg-obs",
  "kg-db",
  "kg-governance",
  "kg-graph",
  "kg-jobs",
  "kg-knowledge",
  "kg-ingestion",
  "kg-memory",
  "kg-extraction",
  "kg-modelgw",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_reconcile"]

[tool.uv.sources]
kg-common = { workspace = true }
kg-domain = { workspace = true }
kg-obs = { workspace = true }
kg-db = { workspace = true }
kg-governance = { workspace = true }
kg-graph = { workspace = true }
kg-jobs = { workspace = true }
kg-knowledge = { workspace = true }
kg-ingestion = { workspace = true }
kg-memory = { workspace = true }
kg-extraction = { workspace = true }
kg-modelgw = { workspace = true }
