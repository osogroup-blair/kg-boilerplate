[project]
name = "kg-governance"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "pyjwt==2.15.1",
  "cryptography==50.0.2",
  "kg-domain",
  "kg-db",
  "kg-common",
  "kg-obs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_governance"]

[tool.uv.sources]
kg-domain = { workspace = true }
kg-db = { workspace = true }
kg-common = { workspace = true }
kg-obs = { workspace = true }
