[project]
name = "kg-obs"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "structlog",
  "prometheus-client",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "kg-common",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_obs"]

[tool.uv.sources]
kg-common = { workspace = true }
