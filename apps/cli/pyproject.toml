[project]
name = "kg-cli"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "typer",
  "httpx==0.28.1",
  "kg-common",
  "kg-domain",
  "kg-obs",
  "kg-db",
  "kg-governance",
  "kg-modelgw",
  "kg-graph",
  "kg-ontology",
  "kg-knowledge",
  "kg-jobs",
  "kg-ingestion",
  "kg-extraction",
  "kg-memory",
  "kg-reconcile",
]

[project.scripts]
kg = "kg_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_cli"]

[tool.uv.sources]
kg-common = { workspace = true }
kg-domain = { workspace = true }
kg-obs = { workspace = true }
kg-db = { workspace = true }
kg-governance = { workspace = true }
kg-modelgw = { workspace = true }
kg-graph = { workspace = true }
kg-ontology = { workspace = true }
kg-knowledge = { workspace = true }
kg-jobs = { workspace = true }
kg-ingestion = { workspace = true }
kg-extraction = { workspace = true }
kg-memory = { workspace = true }
kg-reconcile = { workspace = true }
