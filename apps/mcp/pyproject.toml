[project]
name = "kg-mcp"
version = "0.1.0"
description = "MCP server: a stateless transport that forwards the caller's own platform key to the HTTP API through the SDK"
requires-python = "==3.12.*"
dependencies = [
  "mcp==1.30.0",
  "prometheus-client",
  "starlette==1.8.0",
  "uvicorn==0.54.0",
  "kg-platform-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_mcp"]

[tool.uv.sources]
kg-platform-sdk = { workspace = true }
