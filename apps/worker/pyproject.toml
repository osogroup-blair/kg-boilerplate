[project]
name = "kg-worker"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "uvicorn==0.54.0",
  "kg-common",
  "kg-domain",
  "kg-obs",
  "kg-db",
  "kg-governance",
  "kg-modelgw",
  "kg-graph",
  "kg-ontology",
  "kg-knowledge",
  "kg-jobs",
  "kg-ingestion",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kg_worker"]

[tool.uv.sources]
kg-common = { workspace = true }
kg-domain = { workspace = true }
kg-obs = { workspace = true }
kg-db = { workspace = true }
kg-governance = { workspace = true }
kg-modelgw = { workspace = true }
kg-graph = { workspace = true }
kg-ontology = { workspace = true }
kg-knowledge = { workspace = true }
kg-jobs = { workspace = true }
kg-ingestion = { workspace = true }
